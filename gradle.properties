org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# IntelliJ Platform properties
platformType=IC
platformVersion=2025.1.1
platformDownloadSources=true

# Plugin properties
pluginGroup=io.loglens
pluginName=LogLens
pluginVersion=0.1.0
pluginSinceBuild=243
pluginUntilBuild=253.*

# Signing — left empty (unsigned local builds only)
# Provide a certificate via env vars or signing.properties when publishing.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html

# Sandbox UI for headless test rendering
sandboxDirectory=${project.buildDir}/idea-sandbox